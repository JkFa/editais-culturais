line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Trechos reais de editais copiados literalmente das fixtures.
"tests/*" = ["E501"]
# Regex longas e textos de fila (Issues) ficam legíveis em uma linha.
"worker/*" = ["E501"]
"worker/coletores/*" = ["E501"]
