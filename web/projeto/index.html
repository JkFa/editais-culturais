<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Assistente de projetos culturais</title>
    <meta name="description" content="Escreva seu projeto cultural para um edital, seção por seção, com ajuda de um assistente que só usa o que você informa." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
    <script>(function(){try{var t=localStorage.getItem('editais-culturais:tema');if(t==='claro'||t==='escuro'){document.documentElement.dataset.tema=t;var c=t==='escuro'?'#161513':'#f7f5f0',m=document.querySelectorAll('meta[name=theme-color]');for(var i=0;i<m.length;i++){m[i].dataset.padrao=m[i].content;m[i].setAttribute('content',c)}}}catch(e){}})()</script>
    <link rel="icon" href="../assets/img/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/img/icone-180.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="preload" href="../assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://qhendbxavdretpfcwlyn.supabase.co" crossorigin />
    <link rel="stylesheet" href="../assets/css/fontes.css" />
    <link rel="stylesheet" href="../assets/css/tema.css" />
    <link rel="stylesheet" href="../assets/css/editorial.css" />
    <link rel="stylesheet" href="../assets/css/projeto.css" />
  </head>
  <body class="pagina-projeto">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho-site">
      <div class="container barra-site">
        <a class="marca" href="../">Editais culturais</a>
        <nav aria-label="Principal">
          <a href="../editais/">Editais</a>
          <a href="./" aria-current="page">Meus projetos</a>
          <a href="../sobre/">Sobre</a>
        </nav>
        <button type="button" class="btn btn-tema" data-alternar-tema>Tema: sistema</button>
      </div>
    </header>
    <main id="conteudo" tabindex="-1">
      <div class="container" id="projeto-raiz">
        <p class="carregando" role="status">Carregando…</p>
        <noscript><p>O assistente precisa de JavaScript para funcionar.</p></noscript>
      </div>
    </main>
    <div class="aviso-live" id="aviso-live" role="status" aria-live="polite"></div>
    <script src="../config.js"></script>
    <script type="module" src="../assets/js/projeto/main.js"></script>
  </body>
</html>
