name: Auditoria de cobertura

on:
  schedule:
    - cron: "0 13 1 * *" # dia 1 de cada mês, 10h em Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: auditoria-cobertura
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Levantar a amostra nos diários oficiais (termos diferentes dos da coleta)
        run: python -m scripts.amostra_recall_qd

      - name: Comparar a amostra de referência com o portal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.auditoria_cobertura
      - name: Commitar o resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/referencia/auditoria.json worker/referencia/amostra_recall.json
          if git diff --cached --quiet; then echo "Sem mudanças."; else
            git commit -m "chore(cobertura): auditoria de recall $(date +%F)"
            git pull --rebase --autostash
            git push
          fi
