name: Sincronizar editais

on:
  schedule:
    - cron: "0 8 * * *" # 05h em Brasília
  workflow_dispatch:
    inputs:
      fonte:
        description: "Opcional: id de uma fonte nova (worker/fontes.yaml) para testar isolada, sem alterar o snapshot"
        required: false
        default: ""
      dry_run:
        description: "Com `fonte`: não grava nada no Supabase (só imprime o resultado)"
        type: boolean
        default: false
      somente_criterios:
        description: "Pula a coleta e roda só a extração de critérios dos editais"
        type: boolean
        default: false
      edital_criterios:
        description: "Com `somente_criterios`: reprocessa só este edital (id numérico da tabela editais)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write # fila de curadoria (candidatos e aprovados)

# Nunca duas coletas ao mesmo tempo (evita conflito no commit do snapshot).
concurrency:
  group: sync-editais
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.somente_criterios != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - name: Coletar editais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FONTE: ${{ inputs.fonte }}
          SEM_GRAVAR: ${{ inputs.dry_run }}
        run: |
          if [ -n "$FONTE" ]; then
            if [ "$SEM_GRAVAR" = "true" ]; then
              python -m worker.scraper_worker --fonte "$FONTE" --dry-run
            else
              python -m worker.scraper_worker --fonte "$FONTE"
            fi
            exit $?
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python -m worker.scraper_worker
          else
            echo "::warning::Secrets do Supabase ausentes: rodando em modo --dry-run (só snapshot)."
            python -m worker.scraper_worker --dry-run
          fi

      # always(): se o Supabase falhar depois de o snapshot ser escrito, o snapshot
      # ainda vai para o repositório (é o fallback do site e o commit mantém o repo ativo).
      - name: Commitar snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/snapshot.json
          [ -f web/data/cobertura.json ] && git add web/data/cobertura.json || true
          [ -f worker/cache/llm_cache.json ] && git add worker/cache/llm_cache.json || true
          [ -f worker/cache/vigias.json ] && git add worker/cache/vigias.json || true
          if git diff --cached --quiet; then
            echo "Snapshot sem alterações."
          else
            git commit -m "chore(dados): snapshot $(TZ=America/Sao_Paulo date +%F)"
            git pull --rebase --autostash
            git push
          fi

  # Extração de critérios dos editais (Assistente, Fase 2). Job PRÓPRIO, depois da coleta: se falhar, a coleta
  # já terminou e foi commitada. Custo zero: Gemini na camada gratuita, no máximo MAX_EDITAIS_POR_DIA por execução.
  # Sem o segredo GEMINI_API_KEY ele só atualiza a fila (extracao_fila) e termina sem erro.
  criterios:
    needs: sync
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - name: Extrair critérios dos editais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_EDITAIS_POR_DIA: ${{ vars.MAX_EDITAIS_POR_DIA }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EDITAL: ${{ inputs.edital_criterios }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Secrets do Supabase ausentes: nada a fazer."
            exit 0
          fi
          if [ -n "$EDITAL" ]; then
            python -m scripts.extrair_criterios --edital "$EDITAL"
          else
            python -m scripts.extrair_criterios
          fi
