name: Municípios do Querido Diário

# Semanal: lista os municípios com diário oficial de texto completo no Querido Diário
# (worker/referencia/querido_diario_municipios.json), para o placar de cobertura. Uma única consulta.
# Se a API falhar, o arquivo anterior é mantido.
on:
  schedule:
    - cron: "30 12 * * 3" # quarta, 09h30 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: municipios-querido-diario
  cancel-in-progress: false

jobs:
  municipios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - name: Listar os municípios cobertos
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.municipios_querido_diario

      - name: Commitar o registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/referencia/querido_diario_municipios.json
          if git diff --cached --quiet; then echo "Sem mudanças."; else
            git commit -m "chore(cobertura): municípios do Querido Diário $(date +%F)"
            git pull --rebase --autostash
            git push
          fi
