name: Conferir fontes bloqueadas

on:
  schedule:
    - cron: "0 12 * * 1" # segunda, 09h em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m worker.bloqueadas
