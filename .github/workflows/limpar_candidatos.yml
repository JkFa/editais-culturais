name: Limpar candidatos vencidos

# Semanal: fecha as Issues `candidato` cujo prazo de inscrição já passou há pelo menos 2 dias (comentário + "não planejada").
# Nunca toca em `aprovado` nem em Issue sem prazo no YAML.
on:
  schedule:
    - cron: "0 12 * * 1" # segunda, 09h em Brasília
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só lista o que fecharia"
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: limpar-candidatos
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - name: Fechar os candidatos vencidos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m scripts.limpar_candidatos_vencidos --dry-run
          else
            python -m scripts.limpar_candidatos_vencidos
          fi
