# fontes_curadas.yaml
# Editais de instituições que não publicam nos Mapas Culturais.
# O worker valida este arquivo e faz upsert com fonte = "curadoria".
#
# Regras:
# - Só entra edital conferido em fonte oficial ou na plataforma de inscrição.
# - Campo sem comprovação fica null. A UI mostra "Não informado no resumo — ver edital".
# - Toda informação derivada leva o trecho que a comprova em `evidencias`.
# - Datas no fuso America/Sao_Paulo. Sem horário confirmado: fim_tem_horario: false.
# - Reconfira `verificado_em` pelo menos uma vez por mês.
#
# Pesquisa de 06/11/2026:
# - Itaú Cultural: nenhum edital com inscrição aberta. O último (Itaú Cultural Play,
#   produções audiovisuais do Centro-Oeste e do Norte) encerrou em 23/04/2026.
# - Sesc: nenhum edital nacional aberto. Os recorrentes estão na seção `radar`.

