# ---------------------------------------------------------------------------------------------
# v4: novas fontes. `tipo`: oficial (publica com evidência) | plataforma (idem, com "via X") |
# descoberta (nunca publica: só abre candidato na fila de curadoria).
# `metodo`: api | html | vigia (hash do texto principal; mudança abre candidato).
# Termos de uso e robots.txt conferidos em 07/11/2026 (links em termos_url; resumo no DECISIONS.md).
# ---------------------------------------------------------------------------------------------
# `cobertura` (opcional): de qual território a fonte é, para o placar (worker/cobertura.py).
#   ente: estado | capital | municipio;  uf;  municipio (nome, para capital/municipio);
#   parcial: true quando a fonte cobre só uma área (ex.: só audiovisual), e conta meio ponto.
# As instâncias de Mapas acima já dizem o território por abrangencia/uf/municipio.
fontes:
  - id: minc-inscricoes-abertas
    nome: "Ministério da Cultura: editais abertos"
    tipo: oficial
    metodo: html
    coletor: minc
    url: "https://www.gov.br/cultura/pt-br/assuntos/editais/inscricoes-abertas"
    termos_url: "https://www.gov.br/cultura/pt-br/acesso-a-informacao"
    termos_conferidos_em: "2026-11-07"
    robots_ok: true
    intervalo_min_entre_requisicoes_s: 2
    ativa: true

